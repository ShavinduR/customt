# Render Blueprint: deploys the CustomT API (Express + Socket.IO).
# Render dashboard → New → Blueprint → select this repository.
# Secrets marked `sync: false` are entered in the dashboard on first deploy.
services:
  - type: web
    name: customt-api
    runtime: node
    rootDir: backend
    plan: starter            # use "free" for demos (sleeps after 15 min idle; first request is slow)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false          # e.g. https://customt.vercel.app (comma-separate several origins)
      - key: PUBLIC_API_URL
        sync: false          # e.g. https://customt-api.onrender.com
      - key: AUCTION_DURATION_MINUTES
        value: 1440
      - key: AUCTION_SCHEDULER_INTERVAL_MS
        value: 10000
      - key: ALLOW_BID_PRICE_INCREASE
        value: false
      - key: MOCK_GATEWAY_LATENCY_MS
        value: 800
      - key: MAX_UPLOAD_MB
        value: 2

